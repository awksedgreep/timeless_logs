name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest

    strategy:
      matrix:
        otp: ["29.0.2"]
        elixir: ["1.20.2"]

    steps:
      - uses: actions/checkout@v5

      - name: Check out timeless-libsql extension
        uses: actions/checkout@v5
        with:
          repository: awksedgreep/timeless-libsql
          ref: v0.6.1
          path: timeless-libsql

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build timeless-libsql extension
        working-directory: timeless-libsql
        run: |
          cargo build --locked --release -p timeless-ext
          mkdir -p ../../timeless-libsql/target/release
          cp target/release/libtimeless_ext.so ../../timeless-libsql/target/release/libtimeless_ext.so

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Check formatting
        run: mix format --check-formatted

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
